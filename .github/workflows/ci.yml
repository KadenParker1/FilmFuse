name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  core-api:
    name: core-api (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core-api/pom.xml

      # Testcontainers needs a Docker daemon; ubuntu-latest ships one and the test profile needs no secrets.
      - name: Run tests
        run: ./mvnw -B test

  ml-service:
    name: python-ml-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python-ml-service/requirements.txt
            python-ml-service/requirements-dev.txt
            python-ml-service/constraints.txt

      # constraints.txt pins every transitive version, the same set the Docker image installs.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # Local test-persona tooling (stdlib-only scripts; MovieLens-dependent tests use fixtures).
      - name: Lint test-persona tooling
        run: ruff check ../tools/personas && ruff format --check ../tools/personas

      - name: Test test-persona tooling
        run: pytest -q ../tools/personas

  # Railway builds these Dockerfiles on deploy; build them here so a broken image fails CI, not a
  # deploy. Build only (nothing is pushed); layers are cached between runs.
  docker:
    name: Docker images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, python-ml-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: filmfuse/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke-test the ML image
        if: matrix.service == 'python-ml-service'
        run: |
          docker run -d --name ml -p 8000:8000 -e ML_INTERNAL_KEY=$(openssl rand -hex 32) filmfuse/python-ml-service:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs ml; exit 1

  # client/types/api.ts mirrors the core-api DTOs by hand and nothing else compares one against
  # the other, so this is the only thing standing between a forgotten field and a runtime
  # `undefined`. Its own job: it needs neither Java nor Node, so it reports in seconds and says
  # plainly which type drifted rather than hiding inside a build log.
  api-type-drift:
    name: api.ts mirrors the core-api DTOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for DTO drift
        run: python3 tools/check_api_type_drift.py

  client:
    name: client (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on any NEW high/critical advisory in production deps; accepted ones are documented in
      # client/SECURITY-AUDIT.md. `|| true` only because npm audit exits non-zero whenever it finds anything.
      - name: npm audit gate
        run: (npm audit --omit=dev --json || true) | node ../tools/npm-audit-gate.cjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false

      - name: Web export
        run: npx expo export -p web
