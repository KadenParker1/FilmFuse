# One-off catalog seed (com.pm.filmfuse.movie.seed.CatalogSeedRunner). Combine with the environment's
# own profile, which supplies the datasource and TMDB token:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local,seed
#   java -jar app.jar --spring.profiles.active=prod,seed            (deployed image)
# No web server: the runner seeds, logs a SeedReport and exits (0 = completed, 1 = aborted).
# Without TMDB_ACCESS_TOKEN it seeds the offline fixture catalog (49 movies).
#
# Sources default to popular,ids (application.properties). The bulk long-tail run (see CLAUDE.md) adds
# TMDB's daily id export and discover-by-year, quality-filtered, with the database size guard:
#   --filmfuse.catalog.seed.sources=popular,ids,export,discover
#   --filmfuse.catalog.seed.export.max-movies=150000     (400000 on Supabase Pro)
#   --filmfuse.catalog.seed.max-database-mb=300          (leaves free-tier room for user data)
#   --filmfuse.catalog.seed.requests-per-second=40       (optional; TMDB allows ~50/s)
spring.main.web-application-type=none
filmfuse.catalog.seed.run-on-startup=true

# Nothing else runs in this process: no scheduled jobs, no background enrichment.
filmfuse.catalog.seed.top-up.enabled=false
filmfuse.catalog.enrichment.enabled=false
filmfuse.vectors.refresh.enabled=false
filmfuse.closeness.enabled=false
filmfuse.digest.enabled=false
