# Railway / Supabase deployment. Every value comes from an environment variable.

# Railway assigns the port at runtime.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Railway terminates TLS at its proxy; trust X-Forwarded-* so HSTS and redirects see https.
server.forward-headers-strategy=framework

# Supabase session pooler, e.g. jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?currentSchema=app
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Encrypted whatever DATABASE_URL says (the driver default `prefer` can fall back to plaintext).
spring.datasource.hikari.data-source-properties.sslmode=require

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER}
# Supabase's asymmetric signing keys are ES256, not the RS256 Spring assumes by default.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# --- Email ---
# Resend over SMTP: SPRING_MAIL_HOST=smtp.resend.com, SPRING_MAIL_PORT=2587 (Resend's alternate
# STARTTLS port - used because hosts often block outbound 25/465/587), SPRING_MAIL_USERNAME=resend,
# SPRING_MAIL_PASSWORD=<Resend API key>. Set FILMFUSE_EMAIL_PROVIDER=smtp to actually send.
filmfuse.email.provider=${FILMFUSE_EMAIL_PROVIDER:mock}
filmfuse.email.from-address=${FILMFUSE_EMAIL_FROM_ADDRESS:FilmFuse <onboarding@resend.dev>}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:2587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# The API reference is a ready-made probe for every route: off in prod (SecurityConfig also
# stops permitting those paths under `prod`).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoint.health.show-details=never
