# Active during ./mvnw test. The datasource is supplied by AbstractIntegrationTest via
# @DynamicPropertySource against a Testcontainers Postgres.

app.cors.allowed-origins=http://localhost:8081

# Never actually called - MockMvc's jwt() post-processor injects the security context directly -
# but the resource server needs a JwtDecoder bean to exist at startup.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/.well-known/jwks.json

filmfuse.email.provider=mock

# Never reach TMDB or Supabase from tests, whatever the developer's environment holds: blank
# credentials select the fixture catalog and the mock storage / auth-admin gateways.
filmfuse.tmdb.access-token=
filmfuse.supabase.url=http://127.0.0.1:55321
filmfuse.supabase.service-role-key=

# Never call an ML service from tests: sessions use the FallbackRanker unless a test stubs MlServiceClient.
filmfuse.ml.base-url=
filmfuse.ml.internal-key=

# No background vector refresh: tests call VectorRefreshScheduler.refreshDue() directly.
filmfuse.vectors.refresh.enabled=false

# No scheduled closeness or digest runs: tests call ClosenessJob.recomputeAll() / DigestJob.sendAll().
filmfuse.closeness.enabled=false
filmfuse.digest.enabled=false
filmfuse.catalog.enrichment.enabled=false
# Never seed the shared test database with the fixture catalog's popular pages.
filmfuse.catalog.enrichment.sparse-below=0
