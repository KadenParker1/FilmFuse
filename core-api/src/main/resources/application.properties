spring.application.name=core-api

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway (owns schema `app`; never edit an applied migration) ---
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# The mail relay is not part of this app's health; a slow relay must not fail a deploy healthcheck.
management.health.mail.enabled=false

# --- OpenAPI (springdoc) ---
# Defaults: /v3/api-docs and /swagger-ui.html. Switched off under `prod`.

# --- Email (see com.pm.filmfuse.email.EmailConfig) ---
# mock logs and sends nothing; smtp delivers via spring.mail.* (Resend in prod, Mailpit locally).
filmfuse.email.provider=mock
filmfuse.email.from-address=FilmFuse <no-reply@filmfuse.local>

# --- Web app origin (invite links, links in emails); no trailing slash ---
filmfuse.app.web-url=${APP_WEB_URL:http://localhost:8081}

# --- CORS (comma-separated origins; Expo web dev server + Expo legacy web port) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# --- TMDB (see com.pm.filmfuse.movie.catalog.MovieCatalogConfig) ---
# v4 "API Read Access Token" (TMDB settings > API), sent as a Bearer header. Blank = the offline
# fixture catalog (catalog/fixture-movies.json), so everything runs without a TMDB account.
filmfuse.tmdb.access-token=${TMDB_ACCESS_TOKEN:}
filmfuse.tmdb.base-url=https://api.themoviedb.org/3
filmfuse.tmdb.image-base-url=https://image.tmdb.org/t/p/

# --- Supabase admin access (see com.pm.filmfuse.user.gateway.SupabaseGatewayConfig) ---
# The service-role key signs profile-photo uploads and deletes Auth users on DELETE /me.
# Blank = mock storage / auth-admin gateways that only log.
filmfuse.supabase.url=${SUPABASE_URL:http://127.0.0.1:55321}
filmfuse.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# --- python-ml-service (see com.pm.filmfuse.reco.ml.MlConfig) ---
# Blank URL = never call it: group sessions use the in-process FallbackRanker (popularity order).
# Requests carry X-Internal-Key: ML_INTERNAL_KEY. 5 s read timeout; any failure also falls back.
filmfuse.ml.base-url=${ML_SERVICE_URL:}
filmfuse.ml.internal-key=${ML_INTERNAL_KEY:}

# --- Interest-vector refresh (see com.pm.filmfuse.reco.service.VectorRefreshScheduler) ---
# Every taste write marks the vector dirty; each tick rebuilds users quiet for at least `debounce`.
# ISO-8601 durations. Single replica only (not distributed-locked).
filmfuse.vectors.refresh.enabled=true
filmfuse.vectors.refresh.interval=PT15S
filmfuse.vectors.refresh.debounce=PT10S
filmfuse.vectors.refresh.batch-size=50

# --- Implicit closeness (see com.pm.filmfuse.social.service.ClosenessJob / ClosenessFormula) ---
# score = clamp(base + co-session-weight * min(1, coSessions / co-session-saturation)
#               + taste-weight * tasteSimilarity, 0, 1), co-sessions within window-days.
# PLACEHOLDER weights - the owner may retune them or replace the formula. Daily, UTC.
filmfuse.closeness.enabled=true
filmfuse.closeness.cron=0 30 3 * * *
filmfuse.closeness.window-days=90
filmfuse.closeness.base=0.4
filmfuse.closeness.co-session-weight=0.35
filmfuse.closeness.co-session-saturation=5
filmfuse.closeness.taste-weight=0.25
filmfuse.closeness.neutral-taste=0.5

# --- Weekly digest email (see com.pm.filmfuse.rating.service.DigestJob); opt-in per user. UTC ---
filmfuse.digest.enabled=true
filmfuse.digest.cron=0 0 9 * * MON

# --- Catalog enrichment (see com.pm.filmfuse.movie.service.CatalogEnrichmentService) ---
# List results carry no certification/keywords; this looks up details for never-checked movies,
# most popular first. Also runs synchronously when an eligible pool comes up short.
filmfuse.catalog.enrichment.enabled=true
filmfuse.catalog.enrichment.interval=PT10M
filmfuse.catalog.enrichment.batch-size=50
filmfuse.catalog.enrichment.sparse-below=100

# --- Request body cap (see com.pm.filmfuse.common.http.RequestBodyLimitFilter); larger is a 413 ---
filmfuse.http.max-body-size=64KB

# --- Rate limiting (see com.pm.filmfuse.common.ratelimit.RateLimiter) ---
# In-memory token buckets: correct for the single Railway replica only (N replicas = N x the limit).
# 429 + Retry-After when a bucket is empty. Defaults live in RateLimitRule; override any of them as
# filmfuse.rate-limit.limits.<name>.capacity / .period (ISO-8601), names:
#   ip 600/PT1M (every request per client address), user 120/PT1M (every request per JWT sub),
#   friend-requests 30/PT1H, invites 20/PT1H (invite links, redeem, POST /groups, group invites),
#   reports 20/PT1H, comments 60/PT1H, sessions 30/PT1H (POST /sessions), photo-upload 20/PT1H,
#   admin-writes 60/PT10M (every POST/PUT/PATCH/DELETE under /api/v1/admin, admins only).
filmfuse.rate-limit.enabled=${FILMFUSE_RATE_LIMIT_ENABLED:true}
filmfuse.rate-limit.max-buckets=100000

# --- Admin portal (see com.pm.filmfuse.admin; who is an admin: CLAUDE.md "Admin portal") ---
# Metrics blocks (catalog / usage / health) are cached this long. catalog.max-database-mb can be set
# between 50 and max-database-mb-ceiling (keep it under the plan's limit; raise both on Supabase Pro).
# database-limit-mb is the plan's limit, shown beside the current size. ml-health-timeout bounds the
# admin health panel's GET /health on the ML service.
filmfuse.admin.metrics-cache-ttl=PT30S
filmfuse.admin.max-database-mb-ceiling=480
filmfuse.admin.database-limit-mb=500
filmfuse.admin.ml-health-timeout=PT2S

# --- Catalog seeder (see com.pm.filmfuse.movie.seed.CatalogSeedService) ---
# Bulk-fills app.movies + content levels from the catalog. One-off full seed: the `seed` profile
# (application-seed.properties; see CLAUDE.md). Movies whose details were fetched within
# refresh-after are skipped, so re-runs are idempotent; the popular-page cursor lives in
# app.catalog_seed_state, so a stopped full run resumes. ISO-8601 durations.
filmfuse.catalog.seed.run-on-startup=false
filmfuse.catalog.seed.popular-pages=500
filmfuse.catalog.seed.id-file=${FILMFUSE_CATALOG_SEED_ID_FILE:}
# 20/s is the default; 40 is safe-ish (TMDB allows roughly 50/s per IP) - retries count too.
filmfuse.catalog.seed.requests-per-second=20
filmfuse.catalog.seed.max-retries=3
filmfuse.catalog.seed.initial-backoff=PT1S
filmfuse.catalog.seed.refresh-after=P7D
filmfuse.catalog.seed.auth-failure-limit=3
filmfuse.catalog.seed.progress-every=250
# What a full seed reads, in this order: popular, ids, export, discover (comma-separated).
filmfuse.catalog.seed.sources=popular,ids
# Stop (ABORTED, cursors kept) once pg_database_size exceeds this many MB, checked before every page /
# batch. Supabase free tier = 500 MB per project; 0 = off.
filmfuse.catalog.seed.max-database-mb=450
# TMDB daily id export (<base-url>/movie_ids_MM_DD_YYYY.json.gz, no auth, ~08:00 UTC; on a 404 the
# previous fallback-days are tried). Untrusted input: long / malformed lines are ignored, reading stops
# at max-lines / max-bytes. Keeps the max-movies most popular non-adult, non-video ids.
filmfuse.catalog.seed.export.base-url=https://files.tmdb.org/p/exports
filmfuse.catalog.seed.export.min-popularity=0
filmfuse.catalog.seed.export.max-movies=150000
filmfuse.catalog.seed.export.fallback-days=3
filmfuse.catalog.seed.export.max-lines=5000000
filmfuse.catalog.seed.export.max-line-length=1024
filmfuse.catalog.seed.export.max-bytes=536870912
# Discover by primary release year, most votes first: from-year..to-year (blank = this year), pages of 20.
filmfuse.catalog.seed.discover.from-year=1920
filmfuse.catalog.seed.discover.to-year=
filmfuse.catalog.seed.discover.pages-per-year=10
filmfuse.catalog.seed.discover.min-votes=10
# Quality bar for the listed sources (after details): failing movies are not stored, counted
# rejectedQuality and skipped for reject-ttl (app.catalog_seed_rejects).
filmfuse.catalog.seed.quality.enabled=true
filmfuse.catalog.seed.quality.sources=export,discover
filmfuse.catalog.seed.quality.require-poster=true
filmfuse.catalog.seed.quality.require-runtime=true
filmfuse.catalog.seed.quality.require-overview=true
filmfuse.catalog.seed.quality.min-votes=5
filmfuse.catalog.seed.quality.reject-ttl=P30D
# Nightly top-up: popular pages 1..pages (new releases), UTC. Single replica only.
filmfuse.catalog.seed.top-up.enabled=true
filmfuse.catalog.seed.top-up.cron=0 0 4 * * *
filmfuse.catalog.seed.top-up.pages=25
# It runs on the shared scheduler and can take minutes (an hour when TMDB is degraded: retries with
# backoff per movie), so the scheduled jobs get more than Spring's single default thread - otherwise
# the top-up would hold up VectorRefreshScheduler's 15 s tick. A job never overlaps itself either way.
spring.task.scheduling.pool.size=4
